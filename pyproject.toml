[project]
name = "empire-platform"
version = "0.1.0"
description = "Identity, workspace, authorization, workflow, and graph foundation for Solo Empire domain cells"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "mcp>=2.3,<3",  # empire-mcp (stdio and hosted Streamable HTTP)
    "sentry-sdk>=2.72,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pgserver>=0.1.4", "httpx>=0.27", "jsonschema>=4.23"]

[project.scripts]
empire-db = "empire_platform.devdb:main"
empire-dev-token = "empire_platform.devtoken:main"
tasks-api = "tasks_api.app:main"
empire-contracts = "empire_platform.contracts:main"
empire-mcp = "empire_mcp.server:main"
empire-mcp-http = "empire_mcp.hosted:main"
empire-automations = "empire_platform.automations:main"
empire-token-rotate = "empire_platform.rotate:main"
empire-token-rotate-hosted = "empire_platform.hosted_rotate:main"
empire-publish = "tasks_api.publisher:main"
empire-monitor = "empire_platform.monitor:main"
empire-neon = "empire_platform.neon:main"
empire-cells = "empire_platform.cells:main"
empire-recurring = "empire_platform.recurring:main"
empire-backlog-sync = "empire_platform.backlog_sync:main"
empire-stripe-reconcile = "empire_platform.stripe_reconcile:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src", "packages/authz", "services/tasks", "services/graph", "services/mcp", "services/platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
files = ["src", "packages/authz", "services", "tests", "scripts"]
exclude = ["^build/"]
mypy_path = ["tests", "src", "packages/authz", "services/tasks", "services/graph", "services/mcp", "services/platform"]
explicit_package_bases = true
strict_equality = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

# Imports that resolve only in some environments: pgserver is the optional bundled PostgreSQL
# (dev extra), platform_identity is a separate repository the tests import when installed,
# task_store / sqlite_task_store are loaded from an adapter checkout outside this repository at
# test time, and jsonschema ships no type information.
[[tool.mypy.overrides]]
module = [
    "pgserver",
    "platform_identity.*",
    "task_store",
    "sqlite_task_store",
    "jsonschema",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src", "packages/authz", "services"]
